<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПромТех — Производство и монтаж ГПО</title>
    <style>
        html {
            scrollbar-gutter: stable;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial Black', sans-serif;
            background-color: #000;
            overflow: hidden;
        }

        .hero-section {
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
                url('https://zavodkranov.ru/wp-content/uploads/2020/12/CHto-takoe-mostovoj-kran.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
        }

        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 60px;
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 3px solid #cc0000;
            z-index: 1000;
            position: fixed;
            width: 100%;
            box-sizing: border-box;
            top: 0;
            left: 0;
        }

        .logo-static {
            font-size: 26px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Arial Black', sans-serif;
            line-height: normal;
            cursor: default;
            user-select: none;
            pointer-events: none;
        }

        .logo-static .part-red {
            color: #cc0000;
        }

        .logo-static .part-white {
            color: #ffffff;
        }

        .nav-container {
            display: flex;
            align-items: center;
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 35px;
            font-size: 13px;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
            letter-spacing: 1.5px;
            font-weight: bold;
            transition: 0.3s;
            line-height: normal;
        }

        nav a:hover {
            color: #cc0000;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero-title {
            color: #fff;
            font-size: 3.5vw;
            line-height: 1.3;
            text-transform: uppercase;
            max-width: 1000px;
            margin: 0;
        }

        .hero-title span {
            color: #cc0000;
        }

        
        @media (max-width: 992px) {
            header {
                padding: 15px 25px;
            }

            .logo-static {
                font-size: 22px;
            }

            .nav-container {
                position: fixed;
                top: 0;
                right: -100%;
                width: 80%;
                max-width: 300px;
                height: 100vh;
                background: rgba(0, 0, 0, 0.95);
                border-left: 3px solid #cc0000;
                box-sizing: border-box;
                transition: 0.4s ease;
                z-index: 999;
                padding-top: 100px;
                align-items: flex-start;
            }

            .nav-container.active {
                right: 0;
            }

            nav {
                flex-direction: column;
                align-items: flex-start;
                width: 100%;
            }

            nav a {
                margin: 0;
                padding: 20px 30px;
                font-size: 16px;
                display: block;
                width: 100%;
                box-sizing: border-box;
                border-bottom: 1px solid #222;
            }

            .burger-menu {
                display: block !important;
                cursor: pointer;
                z-index: 1000;
            }

            .burger-line {
                width: 30px;
                height: 3px;
                background-color: #fff;
                margin: 6px 0;
                transition: 0.3s;
            }

            .burger-menu.active .line1 {
                transform: rotate(-45deg) translate(-6px, 6px);
            }

            .burger-menu.active .line2 {
                opacity: 0;
            }

            .burger-menu.active .line3 {
                transform: rotate(45deg) translate(-6px, -6px);
            }
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 24px;
                padding: 0 20px;
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 15px 20px;
            }

            .logo-static {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="hero-section">
        <header>
            <div class="logo-static">
                <span class="part-red">Пром</span><span class="part-white">Тех</span>
            </div>
            <div class="nav-container" id="navContainer">
                <nav>
                    <a href="index.html" style="color: #cc0000;">Главная</a>
                    <a href="catalog.html">Каталог</a>
                    <a href="about.html">О компании</a>
                    <a href="doc.html">Документы</a>
                    <a href="works.html">Наши работы</a>
                    <a href="contacts.html">Контакты</a>
                </nav>
            </div>
            <div class="burger-menu" style="display: none;" onclick="toggleMenu(this)">
                <div class="burger-line line1"></div>
                <div class="burger-line line2"></div>
                <div class="burger-line line3"></div>
            </div>
        </header>

        <main class="main-content">
            <h1 class="hero-title">
                Производство<br>
                и монтаж <span>грузоподъемного</span><br>
                оборудования
            </h1>
        </main>
    </div>

    <script>
        function toggleMenu(burger) {
            burger.classList.toggle('active');
            document.getElementById('navContainer').classList.toggle('active');

            if (document.getElementById('navContainer').classList.contains('active')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        }
    </script>

</body>

</html>
